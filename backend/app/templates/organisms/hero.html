<section class="hero" role="region" aria-label="Hero section">

    <p class="hero__subtitle">{{ attrs.subtitle or 'Подзаголовок с описанием' }}</p>
    <a class="hero__cta" href="{{ attrs.cta_href or '#' }}">{{ attrs.cta_label or 'Начать' }}</a>
  </div>
</section>
